[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "garment-leads"
version = "0.4.0"
description = "Facebook group scraper for garment/textile business leads — Playwright CDP browser automation with full comment extraction."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Omar Gassab"}]
keywords = ["facebook", "scraper", "garment", "textile", "leads", "tunisia", "playwright"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "click>=8.1",
  "Flask>=3.0",
  "phonenumbers>=8.13",
  "PyYAML>=6.0",
  "playwright>=1.40",
  "dateparser>=1.2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[project.scripts]
garment-leads = "garment_leads.cli:main"

[tool.setuptools.packages.find]
include = ["garment_leads*"]

[tool.setuptools.package-data]
garment_leads = ["sample_group.html", "data/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
no_strict_optional = false
check_untyped_defs = true